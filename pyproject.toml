[project]
name = "atlair-growth"
version = "0.1.0"
description = "Small Claude agent pipeline that tracks and grows Atlair Cloud and Atlair Post's visibility in AI answers and developer communities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atlair-growth = "growth.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["growth"]
