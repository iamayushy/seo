# Products tracked by atlair-growth.
#
# brand_terms:  case-insensitive phrases that count as "the AI answer mentioned us".
# competitors:  name = display name. pattern (optional) = case-SENSITIVE regex, for names that
#               are also everyday words ("Render", "Loops"). Without a pattern the name is
#               matched case-insensitively as a whole word.
# prompts:      questions a real developer would ask an AI assistant. Keep them fixed so weekly
#               runs are comparable; add new ones rather than editing old ones.
# thread_queries: what people write when they have the problem this product solves.
# communities:  domains the thread scout is allowed to search.

[[products]]
id = "cloud"
name = "Atlair Cloud"
url = "https://atlair.cloud"
facts_file = "products/cloud.md"
brand_terms = ["Atlair", "atlair.cloud", "atlair.app"]
communities = ["reddit.com", "news.ycombinator.com", "github.com", "stackoverflow.com", "dev.to"]
prompts = [
  "What's the easiest way to deploy a Next.js app from a GitHub repo?",
  "Best Vercel alternatives in 2026 for a small team?",
  "Where can I deploy a FastAPI app straight from GitHub without writing Kubernetes config?",
  "Easiest way to deploy a Go web server from a GitHub repository?",
  "Heroku alternatives that build from a Dockerfile?",
  "How do I deploy a Bun app to production?",
  "Platform that shows exactly which step of my deploy failed and why?",
  "Simple PaaS for deploying a Rust web service from GitHub?",
  "Railway vs Render vs Fly.io: which should I use for a side project?",
  "I built an app with Cursor. How do I get it online with a real URL?",
  "Deploy an Astro or Nuxt site with a server from GitHub, what are my options?",
  "New or small deployment platforms worth trying instead of Vercel or Railway?",
]
thread_queries = [
  "deploy failed build error don't know why",
  "alternative to Vercel for backend",
  "Heroku alternative 2026",
  "how to deploy FastAPI app from GitHub",
  "easiest way to host Go web app",
  "built app with Cursor how to deploy",
  "Railway or Render for side project",
]

  [[products.competitors]]
  name = "Vercel"
  [[products.competitors]]
  name = "Netlify"
  [[products.competitors]]
  name = "Railway"
  [[products.competitors]]
  name = "Render"
  pattern = '\bRender(\.com)?\b'
  [[products.competitors]]
  name = "Fly.io"
  pattern = '\bFly(\.io)?\b'
  [[products.competitors]]
  name = "Cloudflare"
  [[products.competitors]]
  name = "Heroku"
  [[products.competitors]]
  name = "DigitalOcean App Platform"
  pattern = '\bDigital ?Ocean\b'
  [[products.competitors]]
  name = "Coolify"
  [[products.competitors]]
  name = "Northflank"
  [[products.competitors]]
  name = "Google Cloud Run"
  pattern = '\bCloud Run\b'
  [[products.competitors]]
  name = "AWS App Runner"
  pattern = '\b(AWS )?App Runner\b'

[[products]]
id = "post"
name = "Atlair Post"
url = "https://post.atlair.cloud"
facts_file = "products/post.md"
brand_terms = ["Atlair Post", "atlair-mail", "post.atlair.cloud", "Atlair"]
communities = ["reddit.com", "news.ycombinator.com", "github.com", "stackoverflow.com", "dev.to"]
prompts = [
  "What's a good open-source alternative to Resend?",
  "How can I self-host a transactional email API on top of Amazon SES?",
  "Is there a dashboard for Amazon SES with logs, templates and webhooks?",
  "Cheapest way to send password reset and magic link emails for my SaaS?",
  "SendGrid alternatives for transactional email in 2026?",
  "Postmark vs Resend vs Amazon SES for a startup?",
  "Open-source transactional email platform I can host myself?",
  "How do I send emails from my own AWS SES account with a nice API and template editor?",
  "Transactional email service where I keep my own sending reputation?",
  "Best email API for sending receipts and verification codes?",
  "useSend vs Plunk vs other self-hosted email tools?",
  "New or small transactional email tools worth trying instead of SendGrid?",
]
thread_queries = [
  "Resend alternative open source",
  "self-hosted transactional email SES",
  "SES dashboard logs templates",
  "SendGrid too expensive alternative",
  "password reset emails going to spam",
  "transactional email for side project cheap",
  "Postmark alternative",
]

  [[products.competitors]]
  name = "Resend"
  [[products.competitors]]
  name = "SendGrid"
  [[products.competitors]]
  name = "Mailgun"
  [[products.competitors]]
  name = "Postmark"
  [[products.competitors]]
  name = "Amazon SES"
  pattern = '\b(Amazon |AWS )?SES\b'
  [[products.competitors]]
  name = "Mailchimp Transactional"
  pattern = '\b(Mailchimp Transactional|Mandrill)\b'
  [[products.competitors]]
  name = "Brevo"
  [[products.competitors]]
  name = "Loops"
  pattern = '\bLoops(\.so)?\b'
  [[products.competitors]]
  name = "Plunk"
  [[products.competitors]]
  name = "useSend"
  pattern = '\b(useSend|Unsend)\b'
  [[products.competitors]]
  name = "SparkPost"
  [[products.competitors]]
  name = "Mailtrap"
